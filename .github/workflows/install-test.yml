name: Foundation Install Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  install-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      # Make the script executable and run it in CI mode
      - name: Run setup.sh (CI mode)
        run: |
          chmod +x setup.sh
          export APP_DIR="/tmp/foundation-test"
          export SKIP_CLONE=true
          sudo -E bash ./setup.sh

      # Verify that the server started correctly
      - name: Verify server is running
        run: |
          # Ensure pm2 is in PATH (it's installed globally in /usr/local/bin)
          export PATH="$PATH:/usr/local/bin"
          # Check that the process is online
          pm2 jlist | grep -q '"status":"online"'
          echo "Server is running!"

      - name: Show PM2 logs (if verification fails)
        if: failure()
        run: |
          export PATH="$PATH:/usr/local/bin"
          pm2 logs foundation-server --lines 20

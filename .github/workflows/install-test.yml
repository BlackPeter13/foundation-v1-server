name: Foundation Install Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  install-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run setup.sh (CI mode)
        run: |
          chmod +x setup.sh
          export APP_DIR="$PWD"
          export SKIP_CLONE=true
          sudo -E bash ./setup.sh

      - name: Verify server is running (systemd)
        run: |
          sudo systemctl status foundation-server --no-pager
          if systemctl is-active --quiet foundation-server; then
            echo "✅ Server is running successfully!"
          else
            echo "❌ Server is not running"
            exit 1
          fi

      - name: Show service logs (if verification fails)
        if: failure()
        run: |
          echo "=== Service status ==="
          sudo systemctl status foundation-server --no-pager
          echo "=== Last 50 log lines ==="
          sudo journalctl -u foundation-server -n 50 --no-pager

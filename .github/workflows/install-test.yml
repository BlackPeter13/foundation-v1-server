name: Foundation Install Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  install-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies (for native modules)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsodium-dev libboost-system-dev

      - name: Run setup.sh (CI mode)
        # We set SKIP_CLONE=true so the script uses the already-checked-out code.
        # APP_DIR points to a temporary location, so it does not conflict.
        run: |
          export APP_DIR="/tmp/foundation-test"
          export SKIP_CLONE=true
          sudo -E ./setup.sh
        # The script will install Redis, Node.js, npm, PM2, and start the server.

      - name: Verify server is running
        run: |
          # PM2 should be available globally; list processes as the runner user.
          pm2 list | grep -q "foundation-server"
          # Optionally check that the process is online
          pm2 jlist | grep -q '"status":"online"'

      - name: Show logs (for debugging if failed)
        if: failure()
        run: pm2 logs foundation-server --lines 20
